name: cd

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: .
          - service: frontend
            context: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          # fintrix.adityajagtap.com (frontend) and fintrix-api.adityajagtap.com (backend)
          # are separate origins, so the frontend needs the API's real URL baked in.
          build-args: |
            VITE_API_BASE_URL=${{ matrix.service == 'frontend' && 'https://fintrix-api.adityajagtap.com' || '' }}
          # ghcr.io requires an all-lowercase image path — hardcoded lowercase rather than
          # using ${{ github.repository }} directly (the repo owner has uppercase letters).
          tags: ghcr.io/adityajagtap18/fintrix-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin master && git reset --hard origin/master
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
