name: ci

on:
  pull_request:
    branches: [master]
  workflow_call: {} # so cd.yml can run the same checks before deploying

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check src tests

      - name: ruff (format check)
        run: ruff format --check src tests

      - name: mypy --strict
        run: mypy src/core src/api src/functions

      - name: import-linter (Article I, mechanically enforced)
        run: lint-imports

      - name: bandit
        run: bandit -r src -q

      - name: pytest with coverage
        run: pytest tests/unit --cov --cov-report=term-missing --cov-report=xml

      - name: coverage gate — core >= 90% (Article XI)
        run: coverage report --include="src/core/*" --fail-under=90

      - name: coverage gate — overall >= 80% (Article XI)
        run: coverage report --fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    needs: lint-type-test
    strategy:
      matrix:
        include:
          - service: backend
            context: .
          - service: frontend
            context: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t fintrix-${{ matrix.service }}:${{ github.sha }} ${{ matrix.context }}

      - name: Trivy scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fintrix-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Only fail on vulnerabilities a rebuild could actually fix (apt/apk upgrade in
          # the Dockerfiles handles those) — blocking every deploy on CVEs with no upstream
          # patch yet isn't actionable and just defeats the gate.
          ignore-unfixed: true
          trivyignores: .trivyignore
