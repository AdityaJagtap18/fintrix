name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check src tests

      - name: ruff (format check)
        run: ruff format --check src tests

      - name: mypy --strict
        run: mypy src/core src/api src/functions

      - name: import-linter (Article I, mechanically enforced)
        run: lint-imports

      - name: bandit
        run: bandit -r src -q

      - name: pytest with coverage gate
        run: pytest tests/unit --cov --cov-report=term-missing --cov-report=xml
        # fail_under = 90 is enforced by [tool.coverage.report] in pyproject.toml,
        # covering src/core + src/api + src/functions + src/infrastructure — matching
        # constitution Article XI (>=90% on core, >=80% overall; 90 stays the gate since
        # it's the stricter bound).

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Activates once a Dockerfile exists (Phase 2, src/api + src/functions containers).
  # Left in place now so the pipeline shape matches README §6 from day one.
  container:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Dockerfile
        id: has_dockerfile
        run: echo "present=$(test -f Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build container image
        if: steps.has_dockerfile.outputs.present == 'true'
        run: docker build -t ap-automation:${{ github.sha }} .

      - name: Trivy scan
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ap-automation:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
