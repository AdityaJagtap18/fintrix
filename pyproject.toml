[project]
name = "ap-automation"
version = "0.1.0"
description = "FINTRIX — Accounts Payable Automation with Human-in-the-Loop (MitraEdge)"
authors = [{ name = "Aditya Jagtap", email = "adiraj2503@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    # Needed to actually run the shipped app (src/api), not just to test it — kept in base
    # `dependencies` rather than `dev` so the production image installs exactly this list
    # plus `.[ocr]`, with no linting/test tooling along for the ride.
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    # FastAPI's TestClient is httpx-based — this is a test-only dependency, unlike
    # fastapi/uvicorn above which the running app itself needs.
    "httpx>=0.27",
]
# The Tesseract OCR adapter (core/extraction/tesseract_ocr.py) imports these lazily, only
# inside the functions that actually call the engine — so unit tests (which inject fake
# pdf_to_images/ocr_image callables) never need them installed. Kept separate because they
# also need system binaries (the `tesseract-ocr` and `poppler-utils` packages) that aren't
# installed everywhere a plain `pip install` runs; see the Dockerfile for the apt packages.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "Pillow>=10.4",
]
# Added incrementally as later Phase 2 pieces land — kept separate because this genuinely
# isn't exercised by any test yet (T-047 SQL repos) and needs a real Postgres instance to be
# meaningfully testable at all.
db = [
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/core", "src/api", "src/functions"]
branch = true

[tool.coverage.report]
# Constitution Article XI: >=90% on src/core specifically, >=80% overall. No blanket
# fail_under here — ci.yml enforces both bounds as two separate `coverage report
# --include`/`--fail-under` runs against the same collected data, since a single blended
# number can't express "stricter on core, looser on the thinner api/functions surface"
# without either over-constraining api/functions or silently letting core drift.
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["core", "api", "functions"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "rapidfuzz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither pytesseract nor pdf2image ships a py.typed marker / stubs as of this writing.
module = ["pytesseract.*", "pdf2image.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core stays pure (Article I)"
type = "forbidden"
# Deliberately not the whole "core" package: constitution Article I's own enforcement grep
# checks exactly this set (models.py, validation/, routing/, matching/) and no more —
# persistence/review are Protocol-only by construction so an accidental infra import there
# is exactly as bad as anywhere else. The Tesseract OCR adapter (core.extraction.
# tesseract_ocr) needs no exception here, unlike the Azure Document Intelligence adapter it
# replaced: it only ever reaches for pytesseract/pdf2image via a lazy import inside the
# function that calls the engine, never at module level, so it's held to the same pure-core
# bar as every other extraction submodule.
source_modules = [
    "core.models",
    "core.validation",
    "core.routing",
    "core.matching",
    "core.persistence",
    "core.review",
    "core.extraction.base",
    "core.extraction.classification",
    "core.extraction.splitting",
    "core.extraction.cache",
    "core.extraction.tesseract_ocr",
]
forbidden_modules = [
    "azure",
    "infrastructure",
    "functions",
    "api",
    "fastapi",
    "sqlalchemy",
]
