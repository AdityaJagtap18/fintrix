[project]
name = "ap-automation"
version = "0.1.0"
description = "Invoice IQ — Accounts Payable Automation with Human-in-the-Loop (MitraEdge)"
authors = [{ name = "Aditya Jagtap", email = "adiraj2503@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    # core.extraction.preprocessing's blank/duplicate/text-layer checks — a local,
    # deterministic PDF library, not a cloud SDK, so Article I's "no Azure SDK in core"
    # rule doesn't reach it (pyproject.toml's import-linter contract forbids "azure",
    # never "fitz"). Real production dependency, not dev/test-only: this runs on every
    # upload, same footing as rapidfuzz/python-dateutil above.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
    "types-openpyxl>=3.1",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    # Real, tested code in src/api, src/functions/orchestrator, and the Document
    # Intelligence adapter depends on these — none need live Azure credentials to import
    # or to run tests (the Durable Functions orchestrator is unit tested by driving the
    # generator directly, no Functions host involved; FastAPI is tested via TestClient, no
    # server needed; the DI adapter is tested against real SDK model objects built
    # in-test with a fake credential, no live resource involved).
    "fastapi>=0.112",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # FastAPI's UploadFile/File() need this to parse multipart bodies
    "azure-functions>=1.20",
    "azure-functions-durable>=1.2",
    "azure-ai-documentintelligence>=1.0.0b4",
    # T-047's Cosmos repositories: testable the same way the DI adapter above is, against
    # the real SDK's exception/response types with a fake ContainerProxy
    # (tests/unit/fakes.py) — no live account or emulator involved. Unlike blob/service bus
    # below, there's real, tested code exercising this.
    "azure-cosmos>=4.7",
    # `make run-api` needs this to serve src/api locally against the in-memory
    # ReviewAssignmentRepository placeholder (see api/dependencies.py) — no Azure
    # resource or credential involved, it's the laptop dev server.
    "uvicorn[standard]>=0.30",
    # api/dependencies.py imports both at module level (get_azure_credential,
    # load_dotenv()) — api.main fails to import at all without these, which every
    # test importing it (test_review_api.py, test_processing_api.py) does. This is the
    # credential plumbing itself, not one of the not-yet-testable Phase 2 adapters below.
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
    # api/observability.py emits every counter through the OpenTelemetry metrics API
    # unconditionally (it's a real, always-importable no-op with nothing configured —
    # that's the point of the API/SDK split) so the module needs this to import at all,
    # test collection included. azure-monitor-opentelemetry (the actual exporter +
    # FastAPI auto-instrumentation) is imported lazily, only when telemetry is actually
    # enabled — see api/main.py's _telemetry_enabled — so it still needs to be a real
    # dependency here, just not one every import pays for.
    "opentelemetry-api>=1.27",
    "azure-monitor-opentelemetry>=1.6",
    # GET /api/v1/admin/export — the bank-payment .xlsx of accepted invoices, and
    # api/auth.py's Excel-backed credential store (openpyxl reads that file too, not just
    # writes the export). Not Azure, not conditional on anything being configured, so
    # it's a real dependency like pymupdf above, not one of the Phase-2 azure-only
    # extras below.
    "openpyxl>=3.1",
    # api/auth.py: every AP/Admin password is bcrypt-hashed at rest in the credentials
    # workbook, never stored or compared in plaintext.
    "bcrypt>=4.1",
]
# Added incrementally as later Phase 2 pieces land — kept separate because these genuinely
# aren't exercised by any test yet (T-048 blob/service bus adapters) and need real Azure
# resources or credentials to be meaningfully testable at all.
azure = [
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/core", "src/api", "src/functions", "src/infrastructure"]
branch = true

[tool.coverage.report]
# Constitution Article XI: >=90% on src/core specifically, >=80% overall. Coverage.py's
# fail_under is a single blended number, not per-path — 90 here is deliberately the
# stricter of the two, so this run can never silently satisfy "80% overall" while core
# itself has drifted below 90. src/infrastructure (T-047's Cosmos repositories) is
# included because it's genuinely unit-testable against the real SDK's types with a fake
# ContainerProxy (tests/unit/fakes.py) — no live account needed — and sits comfortably
# above the gate. If a future infrastructure module isn't meaningfully testable that way
# (T-048's blob/service bus adapters, still azure-only and untested), split this into two
# `coverage report --include` runs rather than lowering this number to accommodate it.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["core", "api", "functions"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "rapidfuzz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The azure-functions-durable package ships no py.typed marker / stubs as of this writing.
module = "azure.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships partial stubs — mypy resolves types like Document/Page but the methods on
# them (open, get_text, get_images, ...) come back untyped. disallow_untyped_calls is a
# property of the *calling* module, not the one being called into, so this has to target
# core.extraction.preprocessing (the only file that touches pymupdf) rather than
# pymupdf.* itself.
module = "core.extraction.preprocessing"
disallow_untyped_calls = false

[tool.importlinter]
root_package = "core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core stays pure (Article I)"
type = "forbidden"
# Deliberately not the whole "core" package: constitution Article I's own enforcement grep
# checks exactly this set (models.py, validation/, routing/, matching/) and no more —
# core.extraction.document_intelligence is the one sanctioned exception (plan.md §2: "the
# only file importing the DI SDK"), and persistence/review are Protocol-only by
# construction so an accidental Azure import there is exactly as bad as anywhere else. The
# other extraction submodules (base, classification, splitting, cache) are listed
# explicitly so *they* stay held to the same bar even though document_intelligence.py,
# their sibling, isn't.
source_modules = [
    "core.models",
    "core.validation",
    "core.routing",
    "core.matching",
    "core.persistence",
    "core.review",
    "core.extraction.base",
    "core.extraction.classification",
    "core.extraction.splitting",
    "core.extraction.cache",
    "core.payment.instruction",
]
forbidden_modules = [
    "azure",
    "infrastructure",
    "functions",
    "api",
    "fastapi",
]
