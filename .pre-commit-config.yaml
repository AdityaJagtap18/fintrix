repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Deliberately core-only: this hook's isolated env only has what's listed below,
        # not the project .venv — widening files: to api/functions would mean either
        # duplicating fastapi/azure-functions-durable here too (a second place to keep in
        # sync with pyproject.toml) or the hook failing on missing imports. ci.yml's
        # `mypy src/core src/api src/functions` step (using the real venv) is the
        # comprehensive check; this one stays fast and narrow.
        additional_dependencies: [rapidfuzz, types-python-dateutil]
        files: ^src/core/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-q, -r, src]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
