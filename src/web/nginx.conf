server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing): any path that isn't a real static file falls
    # back to index.html, which then renders the right route in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no entry for .mjs (pdf.js ships its worker as one),
    # so it would otherwise fall back to application/octet-stream — browsers refuse to
    # dynamically import() a module served with a non-JS MIME type. default_type only
    # applies when the type can't be determined from mime.types, so this is a no-op for
    # every other extension here.
    location ~* \.(?:js|mjs|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
