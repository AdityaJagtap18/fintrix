# Host nginx vhosts for the FINTRIX deployment (two subdomains: frontend + backend API).
# This file is a REFERENCE for the VPS's own /etc/nginx/sites-available/ — it is not read
# by anything in this repo or baked into either Docker image. Copy it there, symlink it
# into sites-enabled, then run certbot (see docs/RUNBOOK.md once it covers deployment, or
# the deployment playbook this was written from).
#
# Containers bind loopback-only ports (docker-compose.prod.yml) — nginx is the only thing
# on the VPS allowed to listen on 0.0.0.0:80/:443. Ports 8020/8021 were picked because this
# VPS already hosts other projects using 8000/8080/8081/18080/18081/4201 — re-check with
# `ss -tlnp` before reusing this file somewhere else.

server {
    listen 80;
    server_name fintrix.adityajagtap.com;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name fintrix-api.adityajagtap.com;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After `nginx -t && systemctl reload nginx` with the above (HTTP only), get certs for
# both in one shot — certbot edits this file in place to add the 443/ssl blocks and the
# http->https redirect:
#
#   certbot --nginx -d fintrix.adityajagtap.com -d fintrix-api.adityajagtap.com \
#     --non-interactive --agree-tos -m <your-email> --redirect
